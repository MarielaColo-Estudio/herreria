<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuestador de Herrería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
              <h1 class="h1-header">Presupuestador de Trabajos de Herrería</h1>
       <div class="div-enlace-header">
        <nav class="index-nav" aria-current="Galeria">
         <img class="logotipo" src="../img/logo-solu.jpg" alt="logotipo de Soluciones Ezequiel">
        
         <ul class="enlace">
        
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="nosotros.html">nosotros</a></li>
            <li><a href="servicios.html">servicios</a></li>
            <li><a href="contacto.html">contacto</a></li>
            <li><a href="presupuesto.html">presupuesto</a></li>
         </ul>
        </nav>
      </div>
    </header>

    <main>

        <section class="form-section">
            <h2>Nuevo Presupuesto</h2>

            <form id="formPresupuesto">

                <label>Tipo de trabajo</label>
                <select id="tipo" required>
                    <option value="">Seleccionar</option>
                    <option value="Reja">Reja</option>
                    <option value="Portón">Portón</option>
                    <option value="Escalera">Escalera</option>
                    <option value="Baranda">Baranda</option>
                </select>

                <label>Ancho (metros)</label>
                <input type="number" id="ancho" step="0.1" required>

                <label>Alto (metros)</label>
                <input type="number" id="alto" step="0.1" required>

                <label>Material</label>
                <select id="material" required>
                    <option value="">Seleccionar</option>
                    <option value="hierro">Hierro</option>
                    <option value="aluminio">Aluminio</option>
                    <option value="acero">Acero</option>
                </select>

                <div class="extras">
                    <label>
                        <input type="checkbox" id="pintura">
                        Pintura (+$15.000)
                    </label>

                    <label>
                        <input type="checkbox" id="instalacion">
                        Instalación (+$20.000)
                    </label>
                </div>

                <button type="submit">Calcular Presupuesto</button>

            </form>
        </section>

        <section class="result-section">
            <h2>Presupuestos Generados</h2>
            <div id="resultado"></div>
            <button id="btnBorrar">Borrar Historial</button>
        </section>

    </main>
 
    <footer>
        <nav class="footer-enlaces">
            <a href="../index.html">inicio</a>
            <a href="nosotros.html">nosotros</a>
            <a href="servicios.html">servicios</a>
            <a href="galeria.html">galeria</a>
            <a href="contacto.html">contacto</a>
        </nav>

        <div class="logos-icon">

            <address> 
                <a href="mailto:solucionesezequiel@gmail.com" target="_blank" rel="noopener noreferrer">
                    <img class="logos-footer" src="/img/gmail-loog.png" alt="Enviar correo a Soluciones Ezequiel">
                </a>
            </address>
        
            <a href="https://www.instagram.com/soluciones.ezequiel/" target="_blank" rel="noopener noreferrer">
                <img class="logos-footer" src="/img/insta-logo.png" alt="instagram de Soluciones Ezequiel"> 
            </a>

            <a href="https://walink.co/p9vfyy" target="_blank" rel="noopener noreferrer">
                <img class="logos-footer" src="/img/whats-logo.png" alt="Whatsapp de Soluciones Ezequiel"> 
            </a>
            </div>
            <p class="derechos-footer">todos los derechos reservados © 2025 Soluciones Ezequiel</p>
        
    </footer>

</body>
